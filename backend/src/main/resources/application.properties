# Conexão com o BD
spring.application.name=caixu-backend

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_DB_USER}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Pool pequeno para respeitar o limite de sessões do Oracle acadêmico.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Sessão de autenticação
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Atualização aditiva do modelo existente, antes da validação JPA.
# Depois de aplicada, CAIXU_DB_INIT=never desativa a conferência no início.
spring.sql.init.mode=${CAIXU_DB_INIT:always}
spring.sql.init.schema-locations=classpath:db/02_transacoes_sequencias.sql
spring.sql.init.separator=@@
spring.sql.init.encoding=UTF-8

# A conta acadêmica de teste é criada somente com a opção habilitada.
caixu.test-user.enabled=${CAIXU_TEST_USER_ENABLED:false}
caixu.test-user.email=${CAIXU_TEST_USER_EMAIL:}
caixu.test-user.password=${CAIXU_TEST_USER_PASSWORD:}

caixu.cors.origins=${CAIXU_CORS_ORIGINS:http://localhost:3000}
